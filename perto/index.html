<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perto</title>
<style>
  :root { --bg:#0b0c10; --card:#15171f; --linha:#242736; --txt:#e8eaf0; --fraco:#8c93a8;
          --rosa:#e8456b; --verde:#22c55e; --azul:#6366f1; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt);
    font:15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; overscroll-behavior:none; }
  header { padding:14px 16px; font-weight:800; font-size:20px; letter-spacing:-.4px;
    border-bottom:1px solid var(--linha); display:flex; justify-content:space-between; align-items:center; }
  header small { font-weight:500; font-size:11px; color:var(--fraco); }
  main { flex:1; overflow-y:auto; padding:16px; }
  nav { display:flex; border-top:1px solid var(--linha); background:var(--card); }
  nav button { flex:1; background:none; border:none; color:var(--fraco); padding:12px 4px 16px;
    font-size:11px; font-family:inherit; cursor:pointer; }
  nav button b { display:block; font-size:19px; font-weight:400; }
  nav button.on { color:var(--txt); }
  .oculto { display:none !important; }
  label { display:block; font-size:12px; color:var(--fraco); margin:14px 0 4px; }
  input, select, textarea, .btn { width:100%; font-family:inherit; font-size:15px;
    background:var(--card); color:var(--txt); border:1px solid var(--linha);
    border-radius:10px; padding:12px; }
  textarea { resize:vertical; min-height:70px; }
  .btn { background:var(--azul); border:none; font-weight:700; cursor:pointer; text-align:center; margin-top:18px; }
  .btn.sec { background:transparent; border:1px solid var(--linha); font-weight:500; margin-top:8px; }
  .chips { display:flex; gap:8px; margin-top:4px; }
  .chip { flex:1; text-align:center; padding:11px 4px; border:1px solid var(--linha);
    border-radius:10px; font-size:13px; cursor:pointer; background:var(--card); color:var(--fraco); }
  .chip.on { border-color:var(--azul); color:var(--txt); background:#1b1e2e; }
  .erro { color:var(--rosa); font-size:13px; margin-top:12px; min-height:18px; }
  .erro.ok { color:var(--verde); }
  .btn.google { background:#fff; color:#1a1a1a; margin-top:20px; }

  /* fotos no perfil */
  .grade { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:4px; }
  .slot { aspect-ratio:3/4; border:1px dashed var(--linha); border-radius:10px; cursor:pointer;
    background:var(--card) center/cover no-repeat; position:relative;
    display:flex; align-items:center; justify-content:center; color:var(--fraco); font-size:30px; }
  .slot.cheio { border-style:solid; }
  .slot .x { position:absolute; top:5px; right:5px; width:24px; height:24px; border-radius:50%;
    background:rgba(0,0,0,.7); color:#fff; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .slot .capa { position:absolute; bottom:5px; left:5px; font-size:9px; color:#fff;
    background:rgba(0,0,0,.7); padding:2px 6px; border-radius:6px; }
  .aviso { color:var(--fraco); font-size:12px; margin-top:10px; }

  /* deck */
  #pilha { position:relative; height:min(66vh, 480px); }
  .carta { position:absolute; inset:0; background:var(--card); border:1px solid var(--linha);
    border-radius:18px; overflow:hidden; display:flex; flex-direction:column;
    justify-content:flex-end; padding:18px; }
  .carta .ini { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:92px; font-weight:800; color:#2b3047; }
  .carta .foto { position:absolute; inset:0; background:center/cover no-repeat; }
  .carta .sombra { position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.3) 36%, transparent 62%); }
  .pontos { position:absolute; top:10px; left:12px; right:12px; display:flex; gap:4px; }
  .pontos i { flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.32); }
  .pontos i.on { background:#fff; }
  .toque { position:absolute; top:0; bottom:38%; width:38%; }
  .toque.esq { left:0 } .toque.dir { right:0 }
  .carta .dados { position:relative; }
  .carta h2 { margin:0; font-size:23px; }
  .carta p { margin:4px 0 0; color:var(--fraco); font-size:13px; }
  .selo { position:absolute; top:20px; font-size:26px; font-weight:900; padding:6px 14px;
    border:3px solid; border-radius:10px; opacity:0; }
  .selo.sim { left:20px; color:var(--verde); border-color:var(--verde); transform:rotate(-14deg); }
  .selo.nao { right:20px; color:var(--rosa); border-color:var(--rosa); transform:rotate(14deg); }
  #acoes { display:flex; gap:18px; justify-content:center; margin-top:20px; }
  #acoes button { width:62px; height:62px; border-radius:50%; font-size:26px; cursor:pointer;
    background:var(--card); border:1px solid var(--linha); color:var(--txt); }
  #vazio { text-align:center; padding:40px 10px; color:var(--fraco); }
  #vazio b { display:block; color:var(--txt); font-size:17px; margin-bottom:8px; }

  /* matches e chat */
  .linha-match { display:flex; align-items:center; gap:12px; padding:12px; background:var(--card);
    border:1px solid var(--linha); border-radius:12px; margin-bottom:8px; cursor:pointer; }
  .bolha-ini { width:44px; height:44px; border-radius:50%; background:#2b3047; display:flex;
    align-items:center; justify-content:center; font-weight:800; flex:0 0 auto; }
  #chat { display:flex; flex-direction:column; height:100%; }
  #msgs { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-bottom:10px; }
  .msg { max-width:78%; padding:9px 13px; border-radius:16px; font-size:14px; }
  .msg.eu { align-self:flex-end; background:var(--azul); }
  .msg.ele { align-self:flex-start; background:var(--card); border:1px solid var(--linha); }
  #envio { display:flex; gap:8px; padding-top:10px; border-top:1px solid var(--linha); }
  #envio input { border-radius:20px; }
  #envio button { width:auto; padding:12px 18px; border-radius:20px; background:var(--azul);
    border:none; color:#fff; font-weight:700; cursor:pointer; }
  .topo-chat { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .topo-chat button { width:auto; background:none; border:none; color:var(--fraco); font-size:20px;
    padding:0 6px; cursor:pointer; }
  .denunciar { margin-left:auto; font-size:11px; color:var(--fraco); background:none;
    border:1px solid var(--linha); border-radius:8px; padding:6px 10px; cursor:pointer; width:auto; }
</style>
</head>
<body>

<header>
  <span id="titulo">Perto</span>
  <small id="sub"></small>
</header>

<main>
  <!-- LOGIN -->
  <section id="tela-login">
    <p style="color:var(--fraco);margin-top:4px">Encontros em Londrina e Maringá. Maiores de 18.</p>
    <button class="btn google" id="bt-google">Entrar com o Google</button>
    <p style="text-align:center;color:var(--fraco);font-size:12px;margin:16px 0 0">ou com e-mail e senha</p>
    <label>E-mail</label>
    <input id="in-email" type="email" autocomplete="email" placeholder="voce@email.com">
    <label>Senha</label>
    <input id="in-senha" type="password" autocomplete="current-password" placeholder="mínimo 6 caracteres">
    <button class="btn" id="bt-entrar">Entrar</button>
    <button class="btn sec" id="bt-criar">Criar conta</button>
    <div class="erro" id="erro-login"></div>
  </section>

  <!-- PERFIL -->
  <section id="tela-perfil" class="oculto">
    <label>Como quer ser chamado</label>
    <input id="p-nome" maxlength="40" placeholder="Seu nome">
    <label>Data de nascimento</label>
    <input id="p-nasc" type="date">
    <label>Você é</label>
    <div class="chips" id="p-genero">
      <div class="chip" data-v="homem">Homem</div>
      <div class="chip" data-v="mulher">Mulher</div>
      <div class="chip" data-v="outro">Outro</div>
    </div>
    <label>Quer conhecer</label>
    <div class="chips" id="p-busca">
      <div class="chip" data-v="homem">Homens</div>
      <div class="chip" data-v="mulher">Mulheres</div>
      <div class="chip" data-v="outro">Outros</div>
    </div>
    <label>Cidade</label>
    <select id="p-cidade">
      <option value="Londrina">Londrina</option>
      <option value="Maringá">Maringá</option>
    </select>
    <label>Sobre você</label>
    <textarea id="p-bio" maxlength="500" placeholder="Duas linhas bastam."></textarea>
    <label>Fotos</label>
    <div class="grade" id="fotos"></div>
    <input type="file" id="in-foto" accept="image/*" class="oculto">
    <p class="aviso" id="aviso-fotos"></p>
    <button class="btn" id="bt-salvar">Salvar perfil</button>
    <button class="btn sec" id="bt-sair">Sair da conta</button>
    <div class="erro" id="erro-perfil"></div>
    <p class="aviso">Você só aparece para quem você quer conhecer e que também quer te conhecer.
      O interesse é mútuo por regra do banco, não por configuração de tela.</p>
  </section>

  <!-- DECK -->
  <section id="tela-deck" class="oculto">
    <div id="pilha"></div>
    <div id="acoes">
      <button id="bt-nao">✕</button>
      <button id="bt-sim">♥</button>
    </div>
    <div id="vazio" class="oculto"></div>
  </section>

  <!-- MATCHES -->
  <section id="tela-matches" class="oculto">
    <div id="lista-matches"></div>
    <div id="chat" class="oculto">
      <div class="topo-chat">
        <button id="bt-voltar">←</button>
        <b id="chat-nome"></b>
        <button class="denunciar" id="bt-denunciar">denunciar</button>
      </div>
      <div id="msgs"></div>
      <div id="envio">
        <input id="in-msg" placeholder="Escreva…" maxlength="500">
        <button id="bt-enviar">Enviar</button>
      </div>
    </div>
  </section>
</main>

<nav id="barra" class="oculto">
  <button data-t="deck" class="on"><b>♥</b>Perto</button>
  <button data-t="matches"><b>✉</b>Conversas</button>
  <button data-t="perfil"><b>☺</b>Perfil</button>
</nav>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm"

const URL_SUPA = "https://owuizorfskqgrqqfijgt.supabase.co"
const CHAVE_SUPA = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93dWl6b3Jmc2txZ3JxcWZpamd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MDQwNDEsImV4cCI6MjA5MzE4MDA0MX0.oFIsGMzyfZ33MNk-bwRV2vAaZ9_Y-vPEAAa7bE3zA44"
const sb = createClient(URL_SUPA, CHAVE_SUPA)

const $ = s => document.querySelector(s)
const $$ = s => [...document.querySelectorAll(s)]
let eu = null, deck = [], atual = null, matchAberto = null, timerChat = null

function mostrar(tela) {
  for (const t of ["login", "perfil", "deck", "matches"])
    $("#tela-" + t).classList.toggle("oculto", t !== tela)
  $("#barra").classList.toggle("oculto", tela === "login")
  $$("#barra button").forEach(b => b.classList.toggle("on", b.dataset.t === tela))
  if (tela !== "matches") fecharChat()
}

/* ---------- entrada ---------- */
function aviso(txt, bom) {
  const e = $("#erro-login"); e.textContent = txt; e.classList.toggle("ok", !!bom)
}
function credenciais() {
  const email = $("#in-email").value.trim(), senha = $("#in-senha").value
  if (!email || !email.includes("@")) { aviso("Escreva o seu e-mail."); return null }
  if (senha.length < 6) { aviso("A senha precisa de pelo menos 6 caracteres."); return null }
  return { email, password: senha }
}

$("#bt-google").onclick = async () => {
  aviso("")
  const { error } = await sb.auth.signInWithOAuth({ provider: "google",
    options: { redirectTo: location.origin + location.pathname } })
  if (error) aviso(traduz(error.message))
}
$("#bt-entrar").onclick = async () => {
  aviso("")
  const c = credenciais(); if (!c) return
  const { error } = await sb.auth.signInWithPassword(c)
  if (error) { aviso(traduz(error.message)); return }
  await abrir()
}
$("#bt-criar").onclick = async () => {
  aviso("")
  const c = credenciais(); if (!c) return
  const { error } = await sb.auth.signUp(c)
  if (error) { aviso(traduz(error.message)); return }
  const { data } = await sb.auth.getSession()
  if (!data.session) { aviso("Conta criada. Confirme o e-mail e entre.", true); return }
  await abrir()
}
$("#bt-sair").onclick = async () => { await sb.auth.signOut(); eu = null; mostrar("login") }

function traduz(m) {
  if (/Invalid login/i.test(m)) return "E-mail ou senha errados."
  if (/already registered/i.test(m)) return "Esse e-mail já tem conta. Use Entrar."
  if (/at least 6/i.test(m)) return "A senha precisa de 6 caracteres."
  if (/Email not confirmed/i.test(m)) return "Confirme o e-mail que te enviamos."
  return m
}

/* ---------- perfil ---------- */
for (const grupo of ["#p-genero", "#p-busca"]) {
  $$(grupo + " .chip").forEach(c => c.onclick = () => {
    if (grupo === "#p-genero") $$(grupo + " .chip").forEach(o => o.classList.remove("on"))
    c.classList.toggle("on")
  })
}

$("#bt-salvar").onclick = async () => {
  $("#erro-perfil").textContent = ""
  const genero = ($("#p-genero .chip.on") || {}).dataset?.v
  const busca = $$("#p-busca .chip.on").map(c => c.dataset.v)
  if (!genero) { $("#erro-perfil").textContent = "Diga o que você é."; return }
  if (!busca.length) { $("#erro-perfil").textContent = "Diga quem você quer conhecer."; return }
  const { error } = await sb.rpc("perto_salvar", {
    p_nome: $("#p-nome").value, p_nascimento: $("#p-nasc").value, p_genero: genero,
    p_busca: busca, p_cidade: $("#p-cidade").value, p_bio: $("#p-bio").value })
  if (error) {
    const m = error.message || ""
    $("#erro-perfil").textContent =
      /menor de 18/.test(m) ? "O app é para maiores de 18 anos."
      : /nome curto/.test(m) ? "Escreva um nome com pelo menos 2 letras."
      : /invalid input syntax for type date|null value/.test(m) ? "Preencha a data de nascimento."
      : m
    return
  }
  await carregarEu(); mostrar("deck"); await carregarDeck()
}

/* ---------- fotos ---------- */
async function comprimir(arq, lado = 1080, q = 0.82) {
  const img = await new Promise((ok, erro) => {
    const i = new Image(); i.onload = () => ok(i); i.onerror = erro
    i.src = URL.createObjectURL(arq)
  })
  const e = Math.min(1, lado / Math.max(img.width, img.height))
  const c = document.createElement("canvas")
  c.width = Math.round(img.width * e); c.height = Math.round(img.height * e)
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height)
  URL.revokeObjectURL(img.src)
  return await new Promise(ok => c.toBlob(ok, "image/jpeg", q))
}

function renderFotos() {
  const g = $("#fotos"); g.innerHTML = ""
  if (!eu) {
    $("#aviso-fotos").textContent = "Salve o perfil primeiro — depois as fotos aparecem aqui."
    return
  }
  $("#aviso-fotos").textContent = "Até seis. A primeira é a que aparece na carta; toque no ✕ para tirar."
  const fs = eu.fotos || []
  fs.forEach((u, i) => {
    const d = document.createElement("div")
    d.className = "slot cheio"; d.style.backgroundImage = "url(" + u + ")"
    d.innerHTML = '<div class="x">✕</div>' + (i === 0 ? '<div class="capa">capa</div>' : "")
    d.querySelector(".x").onclick = async (ev) => {
      ev.stopPropagation()
      const novas = fs.filter(x => x !== u)
      const { error } = await sb.rpc("perto_fotos", { p_fotos: novas })
      if (error) { $("#aviso-fotos").textContent = error.message; return }
      eu.fotos = novas; renderFotos()
    }
    g.appendChild(d)
  })
  if (fs.length < 6) {
    const a = document.createElement("div")
    a.className = "slot"; a.textContent = "+"
    a.onclick = () => $("#in-foto").click()
    g.appendChild(a)
  }
}

$("#in-foto").onchange = async (ev) => {
  const arq = ev.target.files[0]; ev.target.value = ""
  if (!arq || !eu) return
  $("#aviso-fotos").textContent = "Enviando…"
  try {
    const blob = await comprimir(arq)
    const nome = eu.id + "/" + crypto.randomUUID() + ".jpg"
    const { error } = await sb.storage.from("perto-fotos")
      .upload(nome, blob, { contentType: "image/jpeg" })
    if (error) throw error
    const url = sb.storage.from("perto-fotos").getPublicUrl(nome).data.publicUrl
    const novas = [...(eu.fotos || []), url]
    const r = await sb.rpc("perto_fotos", { p_fotos: novas })
    if (r.error) throw r.error
    eu.fotos = novas; renderFotos()
  } catch (e) {
    $("#aviso-fotos").textContent = "Não subiu: " + (e.message || e)
  }
}

async function carregarEu() {
  const { data } = await sb.rpc("perto_perfil")
  eu = (data && data[0]) || null
  renderFotos()
  if (eu) {
    $("#p-nome").value = eu.nome; $("#p-nasc").value = eu.nascimento
    $("#p-cidade").value = eu.cidade; $("#p-bio").value = eu.bio || ""
    $$("#p-genero .chip").forEach(c => c.classList.toggle("on", c.dataset.v === eu.genero))
    $$("#p-busca .chip").forEach(c => c.classList.toggle("on", (eu.busca || []).includes(c.dataset.v)))
    $("#sub").textContent = eu.cidade
  }
  return eu
}

/* ---------- deck ---------- */
async function carregarDeck() {
  const { data, error } = await sb.rpc("perto_deck", { lim: 30 })
  if (error) { $("#pilha").innerHTML = ""; verVazio(error.message); return }
  deck = data || []
  proxima()
}

function verVazio(msg) {
  $("#acoes").classList.add("oculto")
  const v = $("#vazio"); v.classList.remove("oculto")
  if (msg) { v.innerHTML = "<b>Deu erro</b>" + msg; return }
  v.innerHTML = "<b>Você viu todo mundo de " + (eu ? eu.cidade : "aqui") + "</b>" +
    "Ainda somos poucos. Volte amanhã — cada pessoa nova que entra aparece aqui primeiro para " +
    "quem já estava, não para quem chegou depois."
}

function proxima() {
  $("#vazio").classList.add("oculto")
  $("#acoes").classList.remove("oculto")
  atual = deck.shift() || null
  if (!atual) { $("#pilha").innerHTML = ""; verVazio(); return }
  const fs = (atual.fotos || []).filter(Boolean)
  let i = 0
  $("#pilha").innerHTML =
    '<div class="carta" id="carta">' +
      (fs.length ? '<div class="foto" id="foto"></div><div class="sombra"></div>'
                 : '<div class="ini">' + (atual.nome || "?")[0].toUpperCase() + "</div>") +
      (fs.length > 1 ? '<div class="pontos" id="pontos"></div>' : "") +
      '<div class="selo sim" id="selo-sim">CURTI</div>' +
      '<div class="selo nao" id="selo-nao">PASSO</div>' +
      '<div class="dados"><h2></h2><p></p></div>' +
      (fs.length > 1 ? '<div class="toque esq" id="t-esq"></div><div class="toque dir" id="t-dir"></div>' : "") +
    "</div>"
  $("#carta h2").textContent = atual.nome + ", " + atual.idade
  $("#carta p").textContent = atual.bio || atual.cidade

  function verFoto() {
    $("#foto").style.backgroundImage = "url(" + fs[i] + ")"
    if (fs.length > 1) {
      $("#pontos").innerHTML = fs.map((_, k) =>
        '<i class="' + (k === i ? "on" : "") + '"></i>').join("")
    }
  }
  if (fs.length) {
    verFoto()
    fs.slice(1).forEach(u => { const p = new Image(); p.src = u })
  }
  if (fs.length > 1) {
    $("#t-esq").onclick = () => { i = (i - 1 + fs.length) % fs.length; verFoto() }
    $("#t-dir").onclick = () => { i = (i + 1) % fs.length; verFoto() }
  }
  arrastar($("#carta"))
}

function arrastar(el) {
  let x0 = null, dx = 0
  const fim = () => {
    if (Math.abs(dx) > 90) { responder(dx > 0) }
    else { el.style.transition = "transform .18s"; el.style.transform = ""; selos(0) }
    x0 = null; dx = 0
  }
  el.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; el.style.transition = "none" })
  el.addEventListener("touchmove", e => {
    if (x0 === null) return
    dx = e.touches[0].clientX - x0
    el.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 22) + "deg)"
    selos(dx)
  })
  el.addEventListener("touchend", fim)
  el.addEventListener("touchcancel", fim)
}
function selos(dx) {
  $("#selo-sim").style.opacity = dx > 20 ? Math.min(1, dx / 90) : 0
  $("#selo-nao").style.opacity = dx < -20 ? Math.min(1, -dx / 90) : 0
}

async function responder(sim) {
  const alvo = atual; if (!alvo) return
  const c = $("#carta")
  if (c) { c.style.transition = "transform .25s, opacity .25s"
    c.style.transform = "translateX(" + (sim ? 500 : -500) + "px) rotate(" + (sim ? 24 : -24) + "deg)"
    c.style.opacity = "0" }
  const { data, error } = await sb.rpc("perto_curtir", { alvo: alvo.id, sim })
  setTimeout(proxima, 180)
  if (!error && data === true) alert("Deu match com " + alvo.nome + "! A conversa está em Conversas.")
}
$("#bt-sim").onclick = () => responder(true)
$("#bt-nao").onclick = () => responder(false)

/* ---------- conversas ---------- */
async function carregarMatches() {
  const { data, error } = await sb.rpc("perto_matches")
  const alvo = $("#lista-matches")
  if (error) { alvo.innerHTML = '<p class="aviso">' + error.message + "</p>"; return }
  if (!data || !data.length) {
    alvo.innerHTML = '<p class="aviso">Nenhuma conversa ainda. Match acontece quando os dois curtem.</p>'
    return
  }
  alvo.innerHTML = ""
  for (const m of data) {
    const d = document.createElement("div")
    d.className = "linha-match"
    const bolha = m.foto
      ? '<div class="bolha-ini" style="background:url(' + m.foto + ') center/cover"></div>'
      : '<div class="bolha-ini">' + m.nome[0].toUpperCase() + "</div>"
    d.innerHTML = bolha + '<div><b></b><p ' +
      'style="margin:2px 0 0;color:var(--fraco);font-size:12px"></p></div>'
    d.querySelector("b").textContent = m.nome + ", " + m.idade
    d.querySelector("p").textContent = m.ultima || "Diga algo."
    d.onclick = () => abrirChat(m)
    alvo.appendChild(d)
  }
}

function abrirChat(m) {
  matchAberto = m
  $("#lista-matches").classList.add("oculto")
  $("#chat").classList.remove("oculto")
  $("#chat-nome").textContent = m.nome
  verMsgs()
  timerChat = setInterval(verMsgs, 4000)
}
function fecharChat() {
  if (timerChat) { clearInterval(timerChat); timerChat = null }
  matchAberto = null
  $("#chat").classList.add("oculto")
  $("#lista-matches").classList.remove("oculto")
}
$("#bt-voltar").onclick = () => { fecharChat(); carregarMatches() }

async function verMsgs() {
  if (!matchAberto) return
  const { data } = await sb.rpc("perto_mensagens", { p_match: matchAberto.match_id })
  const box = $("#msgs"); const fundo = box.scrollTop + box.clientHeight > box.scrollHeight - 40
  box.innerHTML = ""
  for (const m of data || []) {
    const d = document.createElement("div")
    d.className = "msg " + (m.meu ? "eu" : "ele")
    d.textContent = m.texto
    box.appendChild(d)
  }
  if (fundo) box.scrollTop = box.scrollHeight
}

$("#bt-enviar").onclick = async () => {
  const t = $("#in-msg").value.trim()
  if (!t || !matchAberto) return
  $("#in-msg").value = ""
  await sb.rpc("perto_enviar", { p_match: matchAberto.match_id, p_texto: t })
  verMsgs()
}
$("#in-msg").addEventListener("keydown", e => { if (e.key === "Enter") $("#bt-enviar").click() })

$("#bt-denunciar").onclick = async () => {
  if (!matchAberto) return
  const motivo = prompt("O que aconteceu? Isso tira a pessoa do seu deck e do seu chat.")
  if (motivo === null) return
  await sb.rpc("perto_denunciar", { alvo: matchAberto.outro, motivo: motivo || "" })
  alert("Denúncia registrada. Vocês não se veem mais.")
  fecharChat(); carregarMatches()
}

/* ---------- navegação ---------- */
$$("#barra button").forEach(b => b.onclick = async () => {
  const t = b.dataset.t
  mostrar(t)
  if (t === "deck") await carregarDeck()
  if (t === "matches") await carregarMatches()
})

async function abrir() {
  await carregarEu()
  if (!eu) { mostrar("perfil"); return }
  mostrar("deck"); await carregarDeck()
}

const { data: sessao } = await sb.auth.getSession()
if (sessao.session) await abrir(); else mostrar("login")
</script>
</body>
</html>
