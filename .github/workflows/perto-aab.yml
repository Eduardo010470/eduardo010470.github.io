name: Perto - gerar AAB

# Compila o Perto como TWA e devolve o .aab assinado como artefato.
# Roda a mao: aba Actions -> "Perto - gerar AAB" -> Run workflow.
#
# Precisa de dois segredos do repositorio:
#   PERTO_KEYSTORE_B64   a keystore inteira em base64 (base64 -w0 perto.keystore)
#   PERTO_KEYSTORE_PASS  a senha da keystore
#
# O ultimo passo escreve tudo que importa na pagina de resumo da execucao,
# inclusive quando o build falha. Nao precisa abrir log de passo nenhum.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar o Bubblewrap
        run: npm install -g @bubblewrap/cli@1.24.1

      - name: Montar o SDK do jeito que o Bubblewrap espera
        run: |
          set -e
          SDK_ORIG="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK original: $SDK_ORIG"
          ls "$SDK_ORIG"
          mkdir -p "$HOME/asdk"
          for d in "$SDK_ORIG"/*; do
            ln -sfn "$d" "$HOME/asdk/$(basename "$d")"
          done
          # o Bubblewrap procura as ferramentas em tools/bin; o runner tem
          # a versao nova, em cmdline-tools/latest/bin. Esse link cobre os dois.
          if [ -d "$SDK_ORIG/cmdline-tools/latest" ]; then
            ln -sfn "$SDK_ORIG/cmdline-tools/latest" "$HOME/asdk/tools"
          fi
          echo "ASDK=$HOME/asdk" >> "$GITHUB_ENV"
          # o Gradle recusa se ANDROID_HOME e ANDROID_SDK_ROOT discordarem
          echo "ANDROID_HOME=$HOME/asdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/asdk" >> "$GITHUB_ENV"
          ls -l "$HOME/asdk"

      - name: Escrever a configuracao do Bubblewrap
        run: |
          set -e
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ASDK" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Aceitar as licencas do SDK
        run: yes | "$ASDK/tools/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Montar a pasta de trabalho
        run: |
          set -e
          mkdir -p work
          cp twa/twa-manifest.json work/twa-manifest.json
          node -e "
          const fs = require('fs');
          const f = 'work/twa-manifest.json';
          const m = JSON.parse(fs.readFileSync(f, 'utf8'));
          const n = Number(process.env.GITHUB_RUN_NUMBER);
          m.appVersionCode = n;
          m.appVersionName = '1.0.' + n;
          fs.writeFileSync(f, JSON.stringify(m, null, 2));
          console.log('versao ' + m.appVersionName + ' / codigo ' + m.appVersionCode);
          "

      - name: Restaurar a chave de assinatura
        env:
          B64: ${{ secrets.PERTO_KEYSTORE_B64 }}
        run: |
          set -e
          if [ -z "$B64" ]; then
            echo "Falta o segredo PERTO_KEYSTORE_B64"
            exit 1
          fi
          printf %s "$B64" | tr -d '\n\r ' | base64 -d > work/perto.keystore
          ls -l work/perto.keystore

      - name: Gerar o projeto Android
        working-directory: work
        run: |
          set -o pipefail
          bubblewrap update --manifest=./twa-manifest.json --skipVersionUpgrade < /dev/null 2>&1 | tee /tmp/update.log

      - name: Compilar o AAB
        working-directory: work
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.PERTO_KEYSTORE_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.PERTO_KEYSTORE_PASS }}
        run: |
          set -o pipefail
          bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json < /dev/null 2>&1 | tee /tmp/build.log

      - name: Relatorio na pagina de resumo
        if: always()
        run: |
          {
            echo "## Diagnostico do build"
            echo ""
            echo "### config.json do Bubblewrap"
            echo '```'
            cat ~/.bubblewrap/config.json 2>&1 || echo "sem config"
            echo '```'
            echo "### conteudo do SDK montado"
            echo '```'
            ls "$ASDK" 2>&1 || echo "sem asdk"
            echo "-- tools/bin --"
            ls "$ASDK/tools/bin" 2>&1 | head -10 || true
            echo "-- build-tools --"
            ls "$ASDK/build-tools" 2>&1 | head -10 || true
            echo '```'
            echo "### saida do 'bubblewrap update'"
            echo '```'
            tail -50 /tmp/update.log 2>&1 || echo "nao rodou"
            echo '```'
            echo "### o que o Gradle reclamou"
            echo '```'
            grep -A 25 "What went wrong" /tmp/build.log 2>/dev/null | head -45 || true
            echo "-- caused by --"
            grep "Caused by" /tmp/build.log 2>/dev/null | head -15 || true
            echo "-- erros --"
            grep -i -E "error:|FAILED|not found|missing" /tmp/build.log 2>/dev/null | head -25 || true
            echo '```'
            echo "### primeiras linhas do build"
            echo '```'
            head -40 /tmp/build.log 2>&1 || echo "nao rodou"
            echo '```'
            echo "### arquivos na pasta work"
            echo '```'
            ls -l work 2>&1 || echo "sem work"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar o AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: perto-aab
          path: work/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 30
